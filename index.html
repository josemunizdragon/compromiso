<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Compromiso IA · Dragon Trade</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#3b5bdb;--blue-l:#e8edff;
  --green:#2f9e44;--green-l:#ebfbee;
  --orange:#f76707;--orange-l:#fff3e0;
  --red:#e03131;--red-l:#fff0f0;
  --ink:#1a1a2e;--muted:#6b7280;
  --bg:#f0f4ff;--card:#fff;--border:#e2e8f0;
}
html,body{min-height:100%;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);}
body{display:flex;flex-direction:column;align-items:center;}
#root{width:100%;display:flex;flex-direction:column;align-items:center;}

.hdr{width:100%;background:var(--ink);color:white;padding:16px 20px;text-align:center;}
.hdr h1{font-size:clamp(17px,5vw,24px);font-weight:900;letter-spacing:-.02em;}
.hdr p{font-size:12px;color:#9ca3af;margin-top:3px;}
.badge{display:inline-block;background:var(--blue);color:white;font-size:11px;font-weight:700;padding:2px 12px;border-radius:100px;margin-top:6px;}

.tabs{width:100%;max-width:500px;display:flex;background:white;border-radius:100px;padding:4px;margin:14px 20px 0;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:100px;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s;color:var(--muted);border:none;background:none;}
.tab.on{background:var(--blue);color:white;}

.wrap{width:100%;max-width:500px;padding:20px 16px 48px;}

.card{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.07);margin-bottom:16px;}
.card h2{font-size:17px;font-weight:900;margin-bottom:4px;}
.card .sub{font-size:13px;color:var(--muted);font-family:'Nunito Sans',sans-serif;margin-bottom:18px;line-height:1.5;}

.fld{margin-bottom:14px;}
.fld label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:5px;}
.fld input,.fld select,.fld textarea{
  width:100%;padding:11px 13px;border:2px solid var(--border);border-radius:11px;
  font-family:'Nunito Sans',sans-serif;font-size:14px;color:var(--ink);
  background:white;outline:none;transition:border .15s;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);}
.fld textarea{resize:vertical;min-height:72px;line-height:1.5;}

.niv-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;}
.niv-opt{border:2px solid var(--border);border-radius:11px;padding:9px 6px;text-align:center;cursor:pointer;transition:all .15s;background:white;}
.niv-opt:hover{border-color:var(--blue);background:var(--blue-l);}
.niv-opt.s1{border-color:var(--green);background:var(--green-l);}
.niv-opt.s2{border-color:var(--blue);background:var(--blue-l);}
.niv-opt.s3{border-color:var(--orange);background:var(--orange-l);}
.niv-opt .ni{font-size:19px;display:block;margin-bottom:3px;}
.niv-opt .nl{font-size:11px;font-weight:800;color:var(--ink);display:block;}
.niv-opt .nd{font-size:10px;color:var(--muted);font-family:'Nunito Sans',sans-serif;margin-top:2px;line-height:1.25;display:block;}

.btn{width:100%;padding:13px;border:none;border-radius:13px;background:var(--blue);color:white;font-family:'Nunito',sans-serif;font-weight:900;font-size:15px;cursor:pointer;margin-top:6px;transition:background .15s,transform .1s;}
.btn:hover{background:#2f4dc4;transform:scale(1.02);}
.btn:disabled{background:#d1d5db;cursor:not-allowed;transform:none;}
.btn.outline{background:white;color:var(--blue);border:2px solid var(--blue);}
.btn.outline:hover{background:var(--blue-l);}
.btn.sm{width:auto;padding:7px 16px;font-size:12px;border-radius:100px;}
.btn.danger{background:white;color:var(--red);border:2px solid #ffc9c9;font-size:12px;padding:7px 14px;}
.btn.danger:hover{background:var(--red-l);}

.ok-icon{font-size:52px;text-align:center;display:block;margin-bottom:10px;}
.ok-detail{background:var(--green-l);border:2px solid #b2f2bb;border-radius:11px;padding:13px 15px;margin-top:14px;}
.ok-detail div{font-size:13px;font-family:'Nunito Sans',sans-serif;color:#1d4a30;margin-bottom:3px;line-height:1.5;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px;}
.stat{background:var(--card);border-radius:13px;padding:12px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.stat .sn{font-size:26px;font-weight:900;color:var(--blue);}
.stat .sl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;}

.filters{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.fbtn{padding:5px 13px;border-radius:100px;border:2px solid var(--border);background:white;font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;cursor:pointer;transition:all .15s;}
.fbtn.on{background:var(--blue);color:white;border-color:var(--blue);}

.comp-card{background:var(--card);border-radius:13px;padding:14px;margin-bottom:9px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-left:4px solid var(--blue);}
.comp-card.n1{border-left-color:var(--green);}
.comp-card.n2{border-left-color:var(--blue);}
.comp-card.n3{border-left-color:var(--orange);}
.comp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:7px;}
.comp-name{font-weight:800;font-size:14px;}
.comp-area{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
.niv-badge{font-size:10px;font-weight:800;padding:2px 9px;border-radius:100px;white-space:nowrap;}
.nb1{background:var(--green-l);color:var(--green);}
.nb2{background:var(--blue-l);color:var(--blue);}
.nb3{background:var(--orange-l);color:var(--orange);}
.comp-row{font-size:12.5px;font-family:'Nunito Sans',sans-serif;color:#374151;margin-bottom:4px;line-height:1.45;}
.comp-meta{font-size:11px;color:var(--muted);font-family:'Nunito Sans',sans-serif;margin-top:6px;}

.login-card{background:var(--card);border-radius:18px;padding:28px 22px;box-shadow:0 4px 20px rgba(0,0,0,.07);text-align:center;}
.login-card h2{font-size:18px;font-weight:900;margin-bottom:4px;}
.login-card p{font-size:13px;color:var(--muted);font-family:'Nunito Sans',sans-serif;margin-bottom:16px;}
.err{color:var(--red);font-size:12px;margin-top:6px;font-family:'Nunito Sans',sans-serif;}

.empty{text-align:center;padding:32px 16px;color:var(--muted);}
.empty .ei{font-size:44px;margin-bottom:10px;}
.empty p{font-size:13px;font-family:'Nunito Sans',sans-serif;}

.info-bar{background:var(--ink);color:#e2e8f0;border-radius:10px;padding:9px 13px;font-size:12px;font-family:'Nunito Sans',sans-serif;line-height:1.5;margin-top:10px;}
.loader{text-align:center;padding:32px;color:var(--muted);font-size:14px;}
.panel-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.sheet-link{font-size:11px;color:var(--blue);font-family:'Nunito Sans',sans-serif;text-decoration:none;font-weight:700;}
.sheet-link:hover{text-decoration:underline;}
.alert{border-radius:11px;padding:11px 14px;font-size:13px;font-family:'Nunito Sans',sans-serif;margin-bottom:12px;line-height:1.5;}
.alert.err-alert{background:var(--red-l);color:#7a0000;border:1.5px solid #ffc9c9;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const PASS       = 'dt2025ia';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUWZAEmYyVFJem91Njb1rBO15pLh4TZUD8dS-nKchI3F4DoZZUqRXJioSrBjgfNWFa/exec';
const SHEET_URL  = 'https://docs.google.com/spreadsheets/d/1Za1-mPffyFeVP9DY9urhipxXe5SPHQsFKFHLkGHqy4A/edit';

const nivelInfo = {
  'Básico':      { badge:'nb1', card:'n1', label:'🌱 Básico' },
  'Intermedio':  { badge:'nb2', card:'n2', label:'🚀 Intermedio' },
  'Avanzado':    { badge:'nb3', card:'n3', label:'⚡ Avanzado' },
};

async function apiPost(data) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  return res;
}

async function apiGet() {
  const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
  const json = await res.json();
  return json;
}

function App() {
  const [tab, setTab]       = useState('form');
  const [authed, setAuthed] = useState(false);
  const [pass, setPass]     = useState('');
  const [passErr, setPassErr] = useState(false);

  return (
    <>
      <div className="hdr">
        <h1>🤖 Compromiso IA</h1>
        <p>Taller de Inteligencia Artificial · Dragon Trade</p>
        <span className="badge">TALLER INTERNO</span>
      </div>

      <div className="tabs">
        <button className={`tab ${tab==='form'?'on':''}`} onClick={()=>setTab('form')}>📋 Mi compromiso</button>
        <button className={`tab ${tab==='panel'?'on':''}`} onClick={()=>setTab('panel')}>📊 Panel líder</button>
      </div>

      <div className="wrap">
        {tab==='form' && <FormView />}
        {tab==='panel' && !authed && (
          <LoginView pass={pass} setPass={setPass} passErr={passErr}
            onLogin={()=>{ if(pass===PASS){setAuthed(true);setPassErr(false);}else setPassErr(true); }} />
        )}
        {tab==='panel' && authed && <PanelView />}
      </div>
    </>
  );
}

function FormView() {
  const empty = { nombre:'', area:'', proceso:'', tiempo:'', herramienta:'', nivel:'', fecha:'', necesita:'' };
  const [form, setForm]     = useState(empty);
  const [done, setDone]     = useState(null);
  const [saving, setSaving] = useState(false);
  const [saveErr, setSaveErr] = useState('');

  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  async function submit() {
    if (!form.nombre||!form.area||!form.proceso||!form.nivel||!form.fecha) {
      alert('Por favor completa: nombre, área, proceso, nivel y fecha.'); return;
    }
    setSaving(true);
    setSaveErr('');
    try {
      await apiPost(form);
      setDone(form);
    } catch(e) {
      setSaveErr('No se pudo guardar. Verifica tu conexión e intenta de nuevo.');
    }
    setSaving(false);
  }

  if (done) return (
    <div className="card" style={{textAlign:'center'}}>
      <span className="ok-icon">🎯</span>
      <h2 style={{color:'var(--green)'}}>¡Compromiso registrado!</h2>
      <p className="sub">Quedó guardado en la hoja de Dragon Trade. José Antonio y tu líder lo revisarán en 2 semanas.</p>
      <div className="ok-detail">
        <div><strong>Nombre:</strong> {done.nombre}</div>
        <div><strong>Área:</strong> {done.area}</div>
        <div><strong>Proceso:</strong> {done.proceso}</div>
        <div><strong>Nivel:</strong> {done.nivel}</div>
        <div><strong>Fecha de prueba:</strong> {done.fecha}</div>
      </div>
      <button className="btn outline" style={{marginTop:14}}
        onClick={()=>{setDone(null);setForm(empty);}}>Registrar otro compromiso</button>
    </div>
  );

  return (
    <div className="card">
      <h2>Tu compromiso de área</h2>
      <p className="sub">Llena este formulario antes de salir del taller. Tarda 2 minutos.</p>

      {saveErr && <div className="alert err-alert">⚠️ {saveErr}</div>}

      <div className="fld">
        <label>Tu nombre completo</label>
        <input value={form.nombre} onChange={e=>set('nombre',e.target.value)}
          placeholder="Ej. Ana García" maxLength={60}/>
      </div>
      <div className="fld">
        <label>Área</label>
        <select value={form.area} onChange={e=>set('area',e.target.value)}>
          <option value="">— Selecciona tu área —</option>
          {['Ventas','Almacén / Logística','Compras','Administración','Marketing','TI / Sistemas','Dirección','Otra'].map(a=>(
            <option key={a}>{a}</option>
          ))}
        </select>
      </div>
      <div className="fld">
        <label>Proceso que vas a probar con IA</label>
        <textarea value={form.proceso} onChange={e=>set('proceso',e.target.value)}
          placeholder="Ej. Redactar el reporte semanal de ventas usando ChatGPT en lugar de hacerlo manualmente." rows={3}/>
      </div>
      <div className="fld">
        <label>¿Cuánto tiempo te toma hoy?</label>
        <input value={form.tiempo} onChange={e=>set('tiempo',e.target.value)}
          placeholder="Ej. 2 horas cada lunes" maxLength={80}/>
      </div>
      <div className="fld">
        <label>Herramienta que vas a usar</label>
        <select value={form.herramienta} onChange={e=>set('herramienta',e.target.value)}>
          <option value="">— Selecciona —</option>
          {['ChatGPT','Claude','Gemini','Copilot (Microsoft)','n8n / Zapier (automatización)','Otra / No sé aún'].map(h=>(
            <option key={h}>{h}</option>
          ))}
        </select>
      </div>
      <div className="fld">
        <label>Nivel de compromiso</label>
        <div className="niv-grid">
          {[
            {v:'Básico',     e:'🌱', l:'Básico',     d:'Pruebo 1 proceso esta semana'},
            {v:'Intermedio', e:'🚀', l:'Intermedio',  d:'3 procesos en 30 días'},
            {v:'Avanzado',   e:'⚡', l:'Avanzado',    d:'Automatización real en 60 días'},
          ].map(n=>(
            <div key={n.v}
              className={`niv-opt ${form.nivel===n.v ? 's'+(n.v==='Básico'?'1':n.v==='Intermedio'?'2':'3') : ''}`}
              onClick={()=>set('nivel',n.v)}>
              <span className="ni">{n.e}</span>
              <span className="nl">{n.l}</span>
              <span className="nd">{n.d}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="fld">
        <label>Fecha de primera prueba</label>
        <input type="date" value={form.fecha} onChange={e=>set('fecha',e.target.value)}
          min={new Date().toISOString().split('T')[0]}/>
      </div>
      <div className="fld">
        <label>¿Qué necesitas para lograrlo? (opcional)</label>
        <input value={form.necesita} onChange={e=>set('necesita',e.target.value)}
          placeholder="Ej. Acceso a ChatGPT Plus, tiempo en agenda…" maxLength={200}/>
      </div>

      <button className="btn" onClick={submit} disabled={saving}>
        {saving ? '⏳ Guardando en Google Sheets…' : 'Registrar mi compromiso ✓'}
      </button>
      <div className="info-bar">
        📌 <strong style={{color:'#ffd43b'}}>Revisión en 2 semanas</strong> — José Antonio + líderes de área
      </div>
    </div>
  );
}

function LoginView({pass,setPass,passErr,onLogin}) {
  return (
    <div className="login-card">
      <div style={{fontSize:46,marginBottom:10}}>🔐</div>
      <h2>Panel de líderes</h2>
      <p>Acceso exclusivo para José Antonio y líderes de área</p>
      <div className="fld" style={{textAlign:'left'}}>
        <label>Contraseña</label>
        <input type="password" value={pass} onChange={e=>setPass(e.target.value)}
          placeholder="Ingresa la contraseña"
          onKeyDown={e=>e.key==='Enter'&&onLogin()}/>
      </div>
      <button className="btn" onClick={onLogin}>Entrar al panel</button>
      {passErr && <p className="err">Contraseña incorrecta</p>}
    </div>
  );
}

function PanelView() {
  const [rows, setRows]     = useState(null);
  const [filter, setFilter] = useState('all');
  const [loading, setLoading] = useState(true);
  const [loadErr, setLoadErr] = useState('');

  const load = useCallback(async () => {
    setLoading(true);
    setLoadErr('');
    try {
      const json = await apiGet();
      if (json.ok && json.rows?.length > 1) {
        // skip header row, map to objects
        const [headers, ...data] = json.rows;
        const mapped = data.map(r => ({
          ts:         r[0], nombre: r[1], area:  r[2],
          proceso:    r[3], tiempo: r[4], herramienta: r[5],
          nivel:      r[6], fecha:  r[7], necesita: r[8]
        }));
        setRows(mapped);
      } else {
        setRows([]);
      }
    } catch(e) {
      setLoadErr('No se pudieron cargar los datos. Verifica la conexión.');
      setRows([]);
    }
    setLoading(false);
  }, []);

  useEffect(()=>{ load(); }, [load]);

  if (loading) return <div className="loader">⏳ Cargando desde Google Sheets…</div>;

  const filtered = filter==='all' ? (rows||[]) : (rows||[]).filter(d=>d.nivel===filter);
  const areas    = new Set((rows||[]).map(d=>d.area)).size;
  const avanzados = (rows||[]).filter(d=>d.nivel==='Avanzado').length;

  return (
    <>
      <div className="panel-hdr">
        <span style={{fontWeight:900,fontSize:17}}>📊 Compromisos</span>
        <div style={{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap'}}>
          <a className="sheet-link" href={SHEET_URL} target="_blank">📄 Ver en Sheets</a>
          <button className="btn sm outline" onClick={load}>↺ Actualizar</button>
        </div>
      </div>

      {loadErr && <div className="alert err-alert">⚠️ {loadErr}</div>}

      <div className="stats">
        <div className="stat"><div className="sn">{(rows||[]).length}</div><div className="sl">Registros</div></div>
        <div className="stat"><div className="sn">{areas}</div><div className="sl">Áreas</div></div>
        <div className="stat"><div className="sn">{avanzados}</div><div className="sl">Nivel ⚡</div></div>
      </div>

      <div className="filters">
        {[['all','Todos'],['Básico','🌱 Básico'],['Intermedio','🚀 Intermedio'],['Avanzado','⚡ Avanzado']].map(([v,l])=>(
          <button key={v} className={`fbtn ${filter===v?'on':''}`} onClick={()=>setFilter(v)}>{l}</button>
        ))}
      </div>

      {filtered.length===0
        ? <div className="empty"><div className="ei">📭</div><p>Aún no hay compromisos{filter!=='all'?' en este nivel':''}.</p></div>
        : [...filtered].reverse().map((d,i)=>{
            const ni = nivelInfo[d.nivel] || {badge:'nb2',card:'n2',label:d.nivel};
            return (
              <div key={i} className={`comp-card ${ni.card}`}>
                <div className="comp-top">
                  <div>
                    <div className="comp-name">{d.nombre}</div>
                    <div className="comp-area">{d.area}</div>
                  </div>
                  <span className={`niv-badge ${ni.badge}`}>{ni.label}</span>
                </div>
                <div className="comp-row">📌 <strong>Proceso:</strong> {d.proceso}</div>
                {d.tiempo     && <div className="comp-row">⏱ <strong>Tiempo actual:</strong> {d.tiempo}</div>}
                {d.herramienta && <div className="comp-row">🔧 <strong>Herramienta:</strong> {d.herramienta}</div>}
                {d.necesita   && <div className="comp-row">💬 <strong>Necesita:</strong> {d.necesita}</div>}
                <div className="comp-meta">📅 {d.fecha} &nbsp;·&nbsp; 🕐 {d.ts}</div>
              </div>
            );
          })
      }
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
